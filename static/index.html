<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Виртуальный гид по университету</title>
    <link rel="stylesheet" href="/static/style.css">
    <style>
  :root {
    --bg-color: #ffffff;
    --text-color: #333333;
  }

  body.dark-theme {
    --bg-color: #121212;
    --text-color: #f0f0f0;
  }

  body {
    background-color: var(--bg-color);
    color: var(--text-color);
    transition: 0.3s;
    font-family: sans-serif;
  }

  #theme-toggle {
    padding: 10px 20px;
    cursor: pointer;
    background: #eee;
    border: 1px solid #ccc;
    border-radius: 5px;
  }
  
  body.dark-theme #theme-toggle {
    background: #333;
    color: #fff;
    border-color: #555;
  }
    </style>
</head>
<body>
    <button id="theme-toggle"> </button>
    <div class="chat-container">
        <div class="chat-header">
            <h1>Виртуальный гид по университету</h1>
        </div>
        <div class="chat-messages" id="messages"></div>
        <div class="chat-input-area">
            <input type="text" id="user-input" placeholder="Введите ваш вопрос...">
            <button id="send-btn">➤</button>
            <button id="mic-btn" class="mic">🎤</button>
        </div>
    </div>

    <div class="avatar-container" id="avatar">
        <img id="avatar-img" src="/static/animations/idle.png" alt="Гид">
    </div>
    <script>
  const btn = document.getElementById('theme-toggle');
  
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-theme');
  }

  btn.addEventListener('click', () => {
    document.body.classList.toggle('dark-theme');
    
    if (document.body.classList.contains('dark-theme')) {
      localStorage.setItem('theme', 'dark');
    } else {
      localStorage.setItem('theme', 'light');
    }
  });
</script>
</body>

    <script src="/static/script.js"></script>
</body>
</html>
